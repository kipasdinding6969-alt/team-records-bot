<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Records — Manager Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* ===================================================================
         GLOBAL DESIGN SYSTEM — Team Records Dashboard v3
         Spacing: 4, 8, 12, 16, 20, 24, 32px — STRICT
         Typography: 11, 12, 13, 14, 16, 20, 24, 28px
         =================================================================== */

      :root {
        --bg: #1a2233;
        --bg-elevated: #1f2a3c;
        --card-bg: #243247;
        --card-border: rgba(255, 255, 255, 0.09);
        --sidebar-bg: #1a2233;
        --sidebar-border: rgba(255, 255, 255, 0.07);
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #6b7a8d;
        --accent: #2dd4bf;
        --accent-hover: #5eead4;
        --accent-light: rgba(45, 212, 191, 0.14);
        --accent-subtle: rgba(45, 212, 191, 0.07);
        --input-bg: #243247;
        --input-border: rgba(255, 255, 255, 0.12);
        --danger: #fb7185;
        --danger-bg: rgba(251, 113, 133, 0.14);
        --success: #34d399;
        --success-bg: rgba(52, 211, 153, 0.14);
        --warning: #fbbf24;
        --warning-bg: rgba(251, 191, 36, 0.14);
        --info: #94a3b8;
        --info-bg: rgba(148, 163, 184, 0.12);
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.16), 0 1px 2px rgba(0, 0, 0, 0.1);
        --shadow-hover: 0 8px 25px -5px rgba(0, 0, 0, 0.25), 0 4px 6px -4px rgba(0, 0, 0, 0.12);
        --shadow-card: 0 1px 4px rgba(0, 0, 0, 0.1);
        --nav-hover-bg: rgba(255, 255, 255, 0.05);
        --glass-bg: rgba(36, 50, 71, 0.75);
        --glass-border: rgba(255, 255, 255, 0.07);
        --scrollbar-track: transparent;
        --scrollbar-thumb: rgba(255, 255, 255, 0.09);
        --radius-card: 12px;
        --radius-btn: 8px;
        --radius-input: 8px;
        --radius-badge: 6px;
      }

      /* === Z-INDEX SCALE ===
       * 1-2:   In-context overlays (sticky headers, icons)
       * 10:    Layout header
       * 25-30: Sidebar & backdrop
       * 50-51: Drawers
       * 100:   Modals
       * 1000:  Toasts/notifications
       * ==================== */

      /* === Base Reset === */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text-primary);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html { scroll-behavior: smooth; overflow-y: scroll; }

      /* === Card System === */
      .card {
        padding: 20px;
        border-radius: var(--radius-card);
        border: 1px solid var(--card-border);
        background: var(--card-bg);
        box-shadow: var(--shadow-card);
      }
      /* Only clickable/interactive cards get hover effects */
      .card-interactive {
        padding: 20px;
        border-radius: var(--radius-card);
        border: 1px solid var(--card-border);
        background: var(--card-bg);
        box-shadow: var(--shadow-card);
        cursor: pointer;
        transition: box-shadow 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
      }
      .card-interactive:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-hover);
        border-color: rgba(45, 212, 191, 0.2);
      }

      /* === Glass Card Effect === */
      .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-card);
      }

      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
      }

      /* === Data Table System === */
      .data-grid-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 13px;
      }
      .data-grid-table thead th {
        padding: 12px 16px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap;
        position: sticky;
        top: 0;
        z-index: 2;
        border-bottom: 1px solid var(--card-border);
        color: var(--text-muted);
        background: var(--bg-elevated);
        cursor: default;
        user-select: none;
      }
      .data-grid-table thead th.sortable { cursor: pointer; }
      .data-grid-table thead th.sortable:hover { color: var(--accent); }
      .data-grid-table thead th .sort-indicator {
        display: inline-block; margin-left: 4px; opacity: 0.5; font-size: 10px;
      }
      .data-grid-table thead th .sort-indicator.active { opacity: 1; color: var(--accent); }
      .data-grid-table tbody td {
        padding: 10px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        color: var(--text-primary);
        font-weight: 500;
      }
      .data-grid-table tbody tr {
        background: transparent;
        transition: background 0.1s ease;
      }
      .data-grid-table tbody tr:nth-child(even) {
        background: rgba(255, 255, 255, 0.015);
      }
      .data-grid-table tbody tr:hover {
        background: var(--accent-subtle);
      }
      .data-grid-table tfoot td {
        padding: 12px 16px;
        font-weight: 700;
        border-top: 2px solid var(--card-border);
        background: var(--accent-subtle);
      }

      /* data-table — lightweight alias matching data-grid-table */
      .data-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 13px;
      }
      .data-table thead th {
        padding: 12px 16px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap;
        position: sticky;
        top: 0;
        z-index: 2;
        border-bottom: 1px solid var(--card-border);
        color: var(--text-muted);
        background: var(--bg-elevated);
        cursor: default;
        user-select: none;
      }
      .data-table tbody td {
        padding: 10px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        color: var(--text-primary);
        font-weight: 500;
      }
      .data-table tbody tr {
        background: transparent;
        transition: background 0.1s ease;
      }
      .data-table tbody tr:nth-child(even) {
        background: rgba(255, 255, 255, 0.015);
      }
      .data-table tbody tr:hover {
        background: var(--accent-subtle);
      }

      /* === Button System === */
      button {
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      button:active { transform: scale(0.97); }
      button:disabled { opacity: 0.4; cursor: not-allowed !important; transform: none; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 40px;
        padding: 0 20px;
        border: 1px solid var(--card-border);
        border-radius: var(--radius-btn);
        background: transparent;
        color: var(--text-secondary);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s ease;
      }
      .btn:hover { background: rgba(255, 255, 255, 0.04); border-color: var(--text-muted); color: var(--text-primary); }

      .btn-primary {
        height: 40px;
        padding: 0 20px;
        border-radius: var(--radius-btn);
        background: var(--accent);
        color: #0f172a;
        border: none;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }
      .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 12px rgba(45, 212, 191, 0.25); }

      .btn-secondary {
        height: 40px;
        padding: 0 20px;
        border-radius: var(--radius-btn);
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid var(--card-border);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
      }
      .btn-secondary:hover { background: rgba(255, 255, 255, 0.04); border-color: var(--text-muted); color: var(--text-primary); }
      .btn-secondary.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

      .btn-danger {
        height: 40px;
        padding: 0 20px;
        border-radius: var(--radius-btn);
        background: var(--danger-bg);
        color: var(--danger);
        border: 1px solid rgba(251, 113, 133, 0.2);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn-danger:hover { background: var(--danger); color: #fff; }

      .btn-sm { height: 32px; padding: 0 14px; font-size: 12px; }
      .btn-xs { height: 28px; padding: 0 10px; font-size: 11px; border-radius: 6px; }
      .btn-pill { border-radius: 20px; }

      .glass-btn {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }
      .glass-btn:hover {
        transform: translateY(-1px);
        filter: brightness(1.1);
      }
      .glass-btn:active { transform: scale(0.97); }

      /* === Input System === */
      input, select, textarea {
        font-family: inherit;
        font-size: 14px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--accent) !important;
        box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.12) !important;
      }
      input:disabled, select:disabled { opacity: 0.4; cursor: not-allowed !important; }

      .input {
        height: 40px;
        padding: 0 14px;
        border-radius: var(--radius-input);
        border: 1px solid var(--input-border);
        background: var(--input-bg);
        color: var(--text-primary);
        font-size: 14px;
        width: 100%;
      }
      .input-lg { height: 48px; font-size: 16px; font-weight: 600; padding: 0 16px; }
      textarea.input { height: auto; min-height: 80px; padding: 12px 14px; resize: vertical; }

      /* === Field Label === */
      .field-label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.3px;
        margin-bottom: 6px;
      }
      .field-label-required::after { content: ' *'; color: var(--danger); }

      /* === Badge / Pill System === */
      .pill-badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 10px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        letter-spacing: 0.02em;
      }
      .badge-success {
        background: var(--success-bg);
        color: var(--success);
        border: 1px solid rgba(52, 211, 153, 0.2);
      }
      .badge-warning {
        background: var(--warning-bg);
        color: var(--warning);
        border: 1px solid rgba(251, 191, 36, 0.2);
      }
      .badge-danger {
        background: var(--danger-bg);
        color: var(--danger);
        border: 1px solid rgba(251, 113, 133, 0.2);
      }
      .badge-info {
        background: var(--info-bg);
        color: var(--info);
        border: 1px solid rgba(148, 163, 184, 0.15);
      }
      .badge-accent {
        background: var(--accent-light);
        color: var(--accent);
        border: 1px solid rgba(45, 212, 191, 0.2);
      }

      /* === Status Badge (solid variants) === */
      .status-badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border-radius: var(--radius-badge);
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
        border: 1px solid transparent;
      }

      /* === Modal System === */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        animation: fadeIn 0.15s ease-out;
      }
      .modal-content {
        width: 560px;
        max-width: 95vw;
        max-height: 90vh;
        overflow-y: auto;
        border-radius: 16px;
        padding: 24px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
      }
      .modal-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text-primary);
        margin: 0 0 20px;
      }
      .modal-actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--card-border);
      }

      /* === Empty State === */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 20px;
        gap: 8px;
        text-align: center;
        color: var(--text-muted);
        border-radius: var(--radius-card);
      }
      .empty-state .empty-icon {
        font-size: 32px;
        opacity: 0.3;
        margin-bottom: 4px;
      }
      .empty-state .empty-text {
        font-size: 13px;
        font-weight: 500;
      }
      .empty-icon-dim {
        font-size: 32px;
        opacity: 0.2;
        color: var(--text-muted);
      }

      /* === Form Layout === */
      .form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .form-grid label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .form-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 0;
      }
      .form-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.3px;
        margin-bottom: 0;
      }

      .form-grid-2col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .form-grid-3col {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 16px;
      }

      /* === Page Container === */
      .page-container {
        width: 100%;
        padding: 24px;
      }

      .page-header {
        margin-bottom: 24px;
      }
      .page-header h1 {
        font-size: 24px;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.02em;
        margin: 0;
        line-height: 1.2;
      }
      .page-header .subtitle {
        font-size: 14px;
        color: var(--text-muted);
        margin-top: 4px;
        font-weight: 500;
      }

      /* Activity item — used in Dashboard, etc */
      .activity-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        transition: background 0.1s ease;
      }
      .activity-item:hover {
        background: var(--accent-subtle);
      }
      .activity-item + .activity-item {
        border-top: 1px solid var(--card-border);
      }
      .activity-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        flex-shrink: 0;
        box-shadow: 0 0 0 4px var(--accent-light);
      }
      .activity-body {
        flex: 1;
        min-width: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .activity-main {
        font-size: 14px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .activity-staff {
        font-weight: 600;
        flex-shrink: 0;
      }
      .activity-sep {
        color: var(--text-muted);
      }
      .activity-content {
        color: var(--text-secondary);
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 400px;
        display: inline-block;
      }
      .activity-time {
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 500;
        flex-shrink: 0;
      }

      /* Pagination bar */
      .pagination {
        display: flex;
        gap: 12px;
        padding: 12px 20px;
        border-top: 1px solid var(--card-border);
        align-items: center;
        justify-content: center;
      }
      .pagination-info {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-secondary);
        min-width: 120px;
        text-align: center;
      }

      /* Search input with icon */
      .search-input-wrap {
        position: relative;
        flex: 1;
        max-width: 320px;
      }
      .search-input-wrap .input {
        padding-left: 32px;
        width: 100%;
      }
      .search-input-wrap .search-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 14px;
        color: var(--text-muted);
        pointer-events: none;
      }

      /* Search icon wrapper — used in NumberLookup */
      .search-icon-wrapper {
        position: relative;
      }
      .search-icon-prefix {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 16px;
        color: var(--text-muted);
        pointer-events: none;
        z-index: 1;
      }

      /* Status indicator */
      .status-ok {
        cursor: default;
        padding: 4px 10px;
        border-radius: 8px;
        background: var(--success-bg);
        border: 1px solid rgba(52, 211, 153, 0.2);
        color: var(--success);
        font-size: 11px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .status-ok .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--success);
        display: inline-block;
      }

      /* Avatar circle */
      .avatar {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-weight: 600;
        flex-shrink: 0;
      }
      .avatar-sm { width: 32px; height: 32px; font-size: 14px; }
      .avatar-md { width: 36px; height: 36px; font-size: 15px; }
      .avatar-lg { width: 48px; height: 48px; font-size: 20px; }

      /* Filter chip bar */
      .filter-chip-bar {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .filter-chip {
        height: 32px;
        padding: 0 14px;
        border-radius: 8px;
        background: transparent;
        color: var(--text-secondary);
        border: 1px solid var(--card-border);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s ease;
      }
      .filter-chip:hover { background: rgba(255, 255, 255, 0.04); border-color: var(--text-muted); }
      .filter-chip.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
      .filter-chip .count {
        font-size: 10px;
        background: rgba(255, 255, 255, 0.06);
        padding: 1px 6px;
        border-radius: 6px;
        min-width: 18px;
        text-align: center;
      }

      /* Phone result badge */
      .phone-check-result {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 13px;
        margin-top: 8px;
      }
      .phone-check-result .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      /* === Section Headers === */
      .page-title {
        font-size: 24px;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.02em;
        margin: 0;
      }
      .page-subtitle {
        font-size: 14px;
        color: var(--text-muted);
        margin-top: 4px;
        font-weight: 500;
      }
      .section-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 0 0 16px;
      }

      /* === Section Gap === */
      .section-gap { margin-bottom: 20px; }
      .mb-8 { margin-bottom: 8px; }
      .mb-12 { margin-bottom: 12px; }
      .mb-16 { margin-bottom: 16px; }
      .mb-20 { margin-bottom: 20px; }
      .mb-24 { margin-bottom: 24px; }
      .mt-20 { margin-top: 20px; }
      .gap-4 { gap: 4px; }
      .gap-8 { gap: 8px; }
      .gap-12 { gap: 12px; }
      .gap-16 { gap: 16px; }
      .gap-20 { gap: 20px; }

      /* === Grid Helpers === */
      .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
      .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
      .grid-4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
      .flex-between { display: flex; justify-content: space-between; align-items: center; }
      .flex-center { display: flex; align-items: center; justify-content: center; }
      .flex-col { display: flex; flex-direction: column; }
      .flex-wrap { flex-wrap: wrap; }

      /* === Stat Row === */
      .stats-row {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .stats-row > * {
        flex: 1;
        min-width: 160px;
      }

      /* === Stat Card === */
      .stat-card {
        padding: 16px 20px;
        border-radius: var(--radius-card);
        border: 1px solid var(--card-border);
        background: var(--card-bg);
      }
      .stat-value {
        font-size: 28px;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .stat-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.3px;
        margin-top: 8px;
      }

      .stat-label .accent-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .stat-sub {
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 500;
      }

      /* === Metric Card (mini) === */
      .metric-card {
        background: var(--bg);
        border-radius: 8px;
        padding: 16px;
        text-align: center;
        border: 1px solid var(--card-border);
      }
      .metric-value {
        font-size: 24px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.03em;
      }
      .metric-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        margin-top: 6px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }

      /* === Tab System === */
      .tab-bar {
        display: flex;
        gap: 4px;
        margin-bottom: 20px;
        padding: 4px;
        background: var(--bg);
        border-radius: 12px;
        border: 1px solid var(--card-border);
      }
      .tab-btn {
        height: 36px;
        padding: 0 20px;
        border-radius: 8px;
        background: transparent;
        color: var(--text-secondary);
        border: none;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s ease;
      }
      .tab-btn:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.04); }
      .tab-btn.active {
        background: var(--accent);
        color: #0f172a;
      }

      /* === Toolbar === */
      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .toolbar-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        white-space: nowrap;
      }
      .toolbar-spacer { flex: 1; }

      /* === Table Wrapper === */
      .table-wrap {
        overflow-x: auto;
        border-radius: var(--radius-card);
        border: 1px solid var(--card-border);
        background: var(--card-bg);
      }

      /* === Toast notification === */
      .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        color: #fff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        z-index: 1000;
        animation: slideDown 0.3s ease-out;
      }
      .toast-success { background: var(--success); }
      .toast-error { background: var(--danger); }
      .toast-info { background: var(--accent); color: #0f172a; }

      /* === Alert Banner === */
      .alert {
        padding: 12px 20px;
        border-radius: var(--radius-card);
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .alert-success { background: var(--success-bg); color: var(--success); border: 1px solid rgba(52, 211, 153, 0.2); }
      .alert-error { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(251, 113, 133, 0.2); }
      .alert-warning { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.2); }
      .alert-info { background: var(--accent-light); color: var(--accent); border: 1px solid rgba(45, 212, 191, 0.2); }

      /* === Phone Display === */
      .phone-mono {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.02em;
      }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }

      /* === Navigation Items (sidebar) === */
      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 2px 12px;
        padding: 10px 16px;
        border-radius: var(--radius-btn);
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.15s ease;
        border-left: 3px solid transparent;
      }
      .nav-item:hover {
        background: var(--nav-hover-bg);
        color: var(--text-primary);
      }
      .nav-item.active {
        color: var(--text-primary);
        background: var(--accent-light);
        font-weight: 600;
        border-left-color: var(--accent);
      }
      .nav-item-icon {
        width: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        opacity: 0.7;
        flex-shrink: 0;
      }
      .nav-item.active .nav-item-icon { opacity: 1; }

      /* === Progress Bar === */
      .progress-bar {
        height: 8px;
        background: var(--bg);
        border-radius: 8px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        border-radius: 8px;
        transition: width 0.6s ease-out;
      }

      /* === Divider === */
      .divider {
        height: 1px;
        background: var(--card-border);
        margin: 20px 0;
      }

      /* === Scrollbar === */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.15); }

      /* === Selection === */
      ::selection { background: var(--accent-light); color: var(--accent); }

      /* === Focus Visible === */
      *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* === Layout Primitives === */
      .layout-root {
        display: flex;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text-primary);
        font-family: 'Inter', -apple-system, sans-serif;
      }
      .layout-sidebar {
        width: 240px;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        z-index: 30;
        border-right: 1px solid var(--glass-border);
        background: var(--sidebar-bg);
        transition: transform 0.3s ease;
      }
      .layout-sidebar.mobile { position: fixed; height: 100vh; }
      .layout-sidebar.collapsed { transform: translateX(-240px); }
      .layout-main {
        flex: 1;
        overflow: auto;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .layout-header {
        height: 52px;
        display: flex;
        align-items: center;
        padding: 0 24px;
        flex-shrink: 0;
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--glass-border);
        gap: 12px;
      }
      .layout-content { flex: 1; min-width: 0; }
      .mobile-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 25;
        backdrop-filter: blur(4px);
      }

      /* Sidebar internals */
      .sidebar-brand {
        padding: 20px 20px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .sidebar-brand-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: bold;
        font-size: 18px;
        box-shadow: 0 4px 16px var(--accent-light);
      }
      .sidebar-brand-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.02em;
      }
      .sidebar-brand-sub {
        font-size: 11px;
        color: var(--text-secondary);
        margin-top: 2px;
        font-weight: 500;
      }
      .sidebar-user {
        padding: 0 12px 12px;
        border-bottom: 1px solid var(--glass-border);
      }
      .sidebar-user-card {
        border-radius: var(--radius-card);
        padding: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .sidebar-user-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--accent-light);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
        font-weight: 600;
        font-size: 15px;
      }
      .sidebar-user-info { flex: 1; min-width: 0; }
      .sidebar-user-name {
        font-size: 14px;
        color: var(--text-primary);
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sidebar-user-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
      }
      .sidebar-user-scope {
        font-size: 11px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 500;
      }
      .sidebar-nav {
        flex: 1;
        padding: 8px 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow-y: auto;
      }
      .sidebar-footer {
        border-top: 1px solid var(--glass-border);
        padding: 12px;
      }
      .sidebar-footer-btns {
        display: flex;
        gap: 8px;
      }

      /* === Content primitives === */
      .content-split {
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }
      .content-split-sidebar {
        width: 280px;
        min-width: 280px;
      }
      .content-split-main {
        flex: 1;
        min-width: 0;
      }
      @media (max-width: 768px) {
        .content-split { flex-direction: column; }
        .content-split-sidebar { width: 100%; min-width: 0; }
      }

      /* Two-column detail layout */
      .detail-grid {
        display: grid;
        grid-template-columns: 65% 35%;
        gap: 20px;
      }
      @media (max-width: 768px) {
        .detail-grid { grid-template-columns: 1fr; }
      }

      /* Frontdesk grid */
      .frontdesk-layout {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr);
        gap: 20px;
        align-items: start;
      }
      @media (max-width: 768px) {
        .frontdesk-layout { grid-template-columns: 1fr; }
      }

      /* === Text utilities === */
      .text-primary { color: var(--text-primary); }
      .text-secondary { color: var(--text-secondary); }
      .text-muted { color: var(--text-muted); }
      .text-accent { color: var(--accent); }
      .text-success { color: var(--success); }
      .text-danger { color: var(--danger); }
      .text-warning { color: var(--warning); }
      .text-right { text-align: right; }
      .text-center { text-align: center; }
      .text-left { text-align: left; }
      .text-uppercase { text-transform: uppercase; letter-spacing: 0.3px; }
      .text-decoration-none { text-decoration: none; }

      .heading-lg { font-size: 24px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; margin: 0; }
      .heading-md { font-size: 18px; font-weight: 700; color: var(--text-primary); margin: 0; }
      .heading-sm { font-size: 16px; font-weight: 700; color: var(--text-primary); margin: 0; }
      .subtitle { font-size: 14px; color: var(--text-muted); font-weight: 500; }
      .caption { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
      .label-sm { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
      .label-section { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }

      .fw-400 { font-weight: 400; }
      .fw-500 { font-weight: 500; }
      .fw-600 { font-weight: 600; }
      .fw-700 { font-weight: 700; }
      .fs-11 { font-size: 11px; }
      .fs-12 { font-size: 12px; }
      .fs-13 { font-size: 13px; }
      .fs-14 { font-size: 14px; }
      .fs-16 { font-size: 16px; }
      .fs-18 { font-size: 18px !important; }
      .fs-20 { font-size: 20px; }
      .fs-24 { font-size: 24px; }

      /* === Display utilities === */
      .d-flex { display: flex; }
      .d-grid { display: grid; }
      .d-none { display: none; }
      .d-inline-flex { display: inline-flex; }
      .flex-1 { flex: 1; }
      .flex-shrink-0 { flex-shrink: 0; }
      .flex-grow-0 { flex-grow: 0; }
      .items-center { align-items: center; }
      .items-start { align-items: flex-start; }
      .items-end { align-items: flex-end; }
      .justify-center { justify-content: center; }
      .justify-between { justify-content: space-between; }
      .justify-end { justify-content: flex-end; }
      .self-start { align-self: flex-start; }
      .self-end { align-self: flex-end; }
      .w-full { width: 100%; }
      .w-auto { width: auto; }
      .min-w-0 { min-width: 0; }
      .overflow-x { overflow-x: auto; }
      .overflow-hidden { overflow: hidden; }
      .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .nowrap { white-space: nowrap; }
      .pointer { cursor: pointer; }
      .not-allowed { cursor: not-allowed; }
      .relative { position: relative; }
      .opacity-50 { opacity: 0.5; }
      .opacity-70 { opacity: 0.7; }
      .opacity-75 { opacity: 0.75; }

      /* === Spacing utilities === */
      .p-0 { padding: 0; }
      .p-4 { padding: 4px; }
      .p-8 { padding: 8px; }
      .p-12 { padding: 12px; }
      .p-16 { padding: 16px; }
      .p-20 { padding: 20px; }
      .p-24 { padding: 24px; }
      .px-12 { padding-left: 12px; padding-right: 12px; }
      .px-16 { padding-left: 16px; padding-right: 16px; }
      .px-20 { padding-left: 20px; padding-right: 20px; }
      .py-8 { padding-top: 8px; padding-bottom: 8px; }
      .py-12 { padding-top: 12px; padding-bottom: 12px; }
      .mt-4 { margin-top: 4px; }
      .mt-8 { margin-top: 8px; }
      .mt-12 { margin-top: 12px; }

      /* === Border utilities === */
      .border-card { border: 1px solid var(--card-border); }
      .border-accent { border: 2px solid var(--accent); }
      .border-accent-subtle { border: 2px solid rgba(45, 212, 191, 0.3); }
      .border-top { border-top: 1px solid var(--card-border); }
      .border-bottom { border-bottom: 1px solid var(--card-border); }
      .border-left-accent { border-left: 3px solid var(--accent); }
      .rounded-8 { border-radius: 8px; }
      .rounded-12 { border-radius: 12px; }
      .rounded-full { border-radius: 9999px; }
      .bg-elevated { background: var(--bg-elevated); }
      .bg-card { background: var(--card-bg); }
      .bg-base { background: var(--bg); }
      .bg-accent-subtle { background: var(--accent-subtle); }
      .bg-success-subtle { background: var(--success-bg); }
      .bg-danger-subtle { background: var(--danger-bg); }
      .bg-warning-subtle { background: var(--warning-bg); }

      /* === Phone status banner === */
      .phone-status-banner {
        margin-top: 8px;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .phone-status-icon {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        flex-shrink: 0;
      }

      /* === Milestone timeline === */
      .milestone-row {
        display: flex;
        align-items: flex-start;
        gap: 0;
        overflow: auto;
      }
      .milestone-step {
        display: flex;
        align-items: center;
        flex: 1;
        min-width: 0;
      }
      .milestone-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
      }
      .milestone-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        flex-shrink: 0;
        margin-bottom: 8px;
      }
      .milestone-dot.active {
        background: var(--success);
        border: 2px solid var(--success);
      }
      .milestone-dot.inactive {
        background: var(--card-border);
        border: 2px solid var(--card-border);
      }
      .milestone-label {
        font-size: 11px;
        font-weight: 600;
        text-align: center;
        line-height: 1.3;
      }
      .milestone-date {
        font-size: 10px;
        color: var(--text-secondary);
        margin-top: 4px;
      }
      .milestone-line {
        height: 2px;
        flex: 1;
        margin-top: -20px;
        min-width: 12px;
      }

      /* === Timeline vertical === */
      .timeline-vertical {
        border-left: 2px solid var(--card-border);
        padding-left: 20px;
        margin-left: 8px;
      }
      .timeline-entry {
        position: relative;
        padding-bottom: 20px;
        margin-bottom: 20px;
      }
      .timeline-entry:last-child {
        padding-bottom: 0;
        margin-bottom: 0;
      }
      .timeline-entry:not(:last-child) {
        border-bottom: 1px solid var(--card-border);
      }
      .timeline-dot {
        position: absolute;
        left: -27px;
        top: 4px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid var(--card-bg);
        box-shadow: 0 0 0 1px var(--card-border);
      }
      .timeline-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .timeline-content-block {
        font-size: 14px;
        color: var(--text-secondary);
        line-height: 1.6;
        background: var(--bg-elevated);
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--card-border);
      }

      /* === Comment system === */
      .comment-item {
        padding: 16px;
        border: 1px solid var(--card-border);
        border-radius: 8px;
      }
      .comment-item.reply {
        border-left: 3px solid var(--accent);
      }
      .comment-item.system {
        background: var(--bg);
        opacity: 0.75;
      }
      .comment-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .comment-actions {
        display: flex;
        gap: 12px;
        margin-top: 12px;
      }
      .comment-action-btn {
        background: none;
        border: none;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        padding: 0;
      }
      .comment-action-btn.reply-btn { color: var(--accent); }
      .comment-action-btn.edit-btn { color: var(--text-secondary); }
      .comment-action-btn.delete-btn { color: var(--danger); }

      /* === Link card === */
      .link-card {
        display: flex;
        gap: 8px;
        padding: 12px;
        background: var(--bg-elevated);
        border-radius: 8px;
        border: 1px solid var(--card-border);
        font-size: 14px;
        align-items: center;
        flex-wrap: wrap;
      }

      /* === Linked client chip === */
      .linked-chip {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 8px;
        background: rgba(45, 212, 191, 0.15);
        color: var(--accent);
        cursor: pointer;
        font-weight: 600;
      }

      /* === Form inline row === */
      .form-row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .form-row-center {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .form-section {
        background: var(--bg-elevated);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid var(--card-border);
      }

      /* === Table cell utilities === */
      .cell-mono {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-weight: 600;
      }
      .cell-mono-right {
        text-align: right;
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
      }
      .cell-right { text-align: right; }
      .cell-center { text-align: center; }

      /* === Inline form for linked add === */
      .inline-form {
        background: var(--bg-elevated);
        border-radius: 8px;
        border: 1px solid var(--card-border);
        padding: 20px;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* === Client search result item === */
      .search-result-item {
        padding: 12px;
        border-radius: 8px;
        cursor: pointer;
        border: 1px solid var(--card-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.15s ease;
      }
      .search-result-item:hover {
        background: var(--accent-subtle);
      }
      .search-result-item.active {
        background: var(--accent-light);
        border-color: var(--accent);
      }

      /* === Note card === */
      .note-card {
        background: var(--bg-elevated);
        padding: 20px;
        border-radius: 8px;
        border: 1px solid var(--card-border);
      }

      /* === Recent entry row === */
      .recent-entry {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 20px;
        background: var(--bg);
        border-radius: 8px;
        border: 1px solid var(--card-border);
      }

      /* === Category button grid === */
      .category-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .category-grid.error {
        border: 2px solid var(--danger);
        border-radius: 8px;
        padding: 4px;

      .category-btn {

        gap: 12px;

      .day-status-buttons {

      /* === Staff target row === */
      .target-row {

        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        background: var(--bg-elevated);
        border-radius: 8px;

      }

      /* === Permission toggle === */
      .perm-toggle {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;

      .perm-toggle.allowed {
        border: 1px solid rgba(52, 211, 153, 0.3);

      }
      .perm-toggle.denied {
        border: 1px solid rgba(251, 113, 133, 0.3);
        background: rgba(251, 113, 133, 0.06);
      }
      .toggle-track {
        width: 36px;
        height: 20px;
        border-radius: 10px;
        position: relative;
        transition: all 0.2s;
        flex-shrink: 0;
      }
      .toggle-track.on { background: var(--success); }
      .toggle-track.off { background: var(--card-border); }
      .toggle-knob {

        height: 16px;
        border-radius: 50%;
        background: #fff;
        position: absolute;
        top: 2px;
        transition: all 0.2s;

      /* === Login page === */

        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;

        padding: 24px;

        height: 56px;

        font-size: 28px;

        font-size: 13px;

      .remember-label {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

        accent-color: var(--accent);
        width: 16px;
        height: 16px;
      }
      .remember-label span {
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 500;
      }

      /* === Group card === */
      .group-card-header {
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .group-member-count {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(45, 212, 191, 0.15);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
      }
      .group-grand-total {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 12px;
      }
      .grand-total-item {
        background: var(--bg);
        border-radius: 8px;
        padding: 12px;
        text-align: center;
        border: 1px solid var(--card-border);

        font-weight: 700;
        line-height: 1.2;

      .grand-total-label {
        font-size: 12px;
        color: var(--text-secondary);
        text-transform: uppercase;
        font-weight: 600;
        margin-top: 8px;

      /* === Burger button === */
      .burger-btn {
        background: transparent;
        border: none;
        color: var(--text-primary);
        font-size: 20px;
        cursor: pointer;
        padding: 4px;
      }

      /* === Mobile brand in header === */
      .mobile-brand {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
      }

      /* === Summary section accordion === */
      .accordion-header {
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
      }
      .accordion-chevron {
        font-size: 12px;
        color: var(--accent);
        transition: transform 0.2s;
        display: inline-block;
      }
      .accordion-chevron.open { transform: rotate(180deg); }

      /* === Grid auto-fit cards === */
      .grid-auto-440 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
        gap: 20px;
      }
      @media (max-width: 480px) {
        .grid-auto-440 { grid-template-columns: 1fr; }
      }

      /* === Additional Utilities (agent-generated) === */
      .align-center { align-items: center; }
      .align-self-end { align-self: flex-end; }
      .align-start { align-items: flex-start; }

      .bg-page { background: var(--bg); }

      .btn-md { height: 40px; font-size: 14px; }

      .grid-auto-240 { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
      .grid-auto-260 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
      .grid-auto-280 { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
      .grid-auto-360 { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
      .grid-auto-400 { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px; }

      .org-team-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--bg-elevated); border-radius: 8px; border: 1px solid var(--card-border); cursor: pointer; transition: background 0.15s; }
      .org-team-header:hover { background: var(--accent-subtle); }
      .org-leader-row { display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 32px; }
      .org-member-row { display: flex; align-items: center; gap: 12px; padding: 6px 16px 6px 48px; font-size: 13px; }
      .overflow-x-auto { overflow-x: auto; }

      .pd-parent-row { background: var(--bg-elevated); font-weight: 600; }

      .perm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }

      .search-input-padded { padding-left: 32px; }
      .stat-card-accent { border: 2px solid rgba(45, 212, 191, 0.3); }
      .sticky-left { position: sticky; left: 0; z-index: 1; background: inherit; }
      .table-sm { font-size: 12px; }
      .table-sm th, .table-sm td { padding: 6px 10px; }
      .text-bold { font-weight: 700; }
      .text-italic { font-style: italic; }
      .text-normal { font-weight: 400; }
      .text-nowrap { white-space: nowrap; }
      .text-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .w-140 { width: 140px; }
      .w-260 { width: 260px; }

      .z-1 { z-index: 1; }
      .z-3 { z-index: 3; }

      /* Drawer (side panel) */
      .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; backdrop-filter: blur(2px); }
      .drawer-right { position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 95vw; background: var(--card-bg); border-left: 1px solid var(--card-border); box-shadow: -8px 0 32px rgba(0,0,0,0.3); z-index: 51; display: flex; flex-direction: column; animation: slideInRight 0.2s ease-out; }
      .drawer-header { padding: 20px 24px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
      .drawer-body { flex: 1; overflow-y: auto; padding: 24px; }
      .drawer-footer { padding: 16px 24px; border-top: 1px solid var(--card-border); display: flex; gap: 12px; justify-content: flex-end; }
      @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }

      /* Collapse arrow */
      .collapse-arrow { display: inline-block; transition: transform 0.2s; font-size: 12px; color: var(--text-muted); }
      .collapse-arrow.expanded { transform: rotate(90deg); }

      /* Expand arrow — used in expandable table rows */
      .expand-arrow {
        display: inline-block;
        font-size: 10px;
        color: var(--text-muted);
        margin-right: 8px;
        transition: transform 0.2s ease;
        cursor: pointer;
      }
      .expand-arrow.open { transform: rotate(90deg); }

      /* Role pills for OrgChart */
      .role-owner { background: rgba(0, 184, 148, 0.12); color: #00b894; }
      .role-admin { background: rgba(253, 203, 110, 0.12); color: #fdcb6e; }
      .role-member { background: rgba(127, 132, 142, 0.12); color: #7f848e; }
      .role-leader { background: rgba(45, 212, 191, 0.12); color: #2dd4bf; }

      @media (max-width: 768px) {
        .grid-2col, .grid-2fr-1fr, .grid-3col { grid-template-columns: 1fr; }
        .drawer-right { width: 100vw; }
      }

      /* === Animations === */
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      @keyframes slideDown { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
      .fade-in { animation: fadeIn 0.2s ease-out; }

      /* === Responsive === */
      @media (max-width: 1024px) {
        .grid-4 { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      }
      @media (max-width: 768px) {
        .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
        .modal-content { width: 95vw; padding: 16px; }
        .data-grid-table thead th, .data-grid-table tbody td { padding: 8px 10px; font-size: 12px; }
        .form-grid-2col, .form-grid-3col { grid-template-columns: 1fr; }
        .toolbar { gap: 8px; }
        .btn-primary, .btn-secondary, .btn-danger { height: 36px; padding: 0 14px; font-size: 12px; }
      }
      @media (max-width: 640px) {
        .grid-2, .grid-3 { grid-template-columns: 1fr; gap: 12px; }

      @media (max-width: 480px) {
        .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }

      /* === Staff Detail Modal === */
      .modal-close-btn {

        padding: 4px;

      .avatar-accent-solid {
        background: var(--accent);

        font-weight: 700;
      }
