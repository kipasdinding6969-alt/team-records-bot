[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    slow: slow tests
    integration: integration tests
addopts = -v --tb=short --timeout=60
filterwarnings =
    ignore::DeprecationWarning:oauthlib.*
    ignore::DeprecationWarning:google.auth.*
    ignore::DeprecationWarning:telethon.*
    ignore::DeprecationWarning:aiosqlite.*
    ignore::RuntimeWarning:aiosqlite.*
    ignore::DeprecationWarning:pytest_asyncio.*
    ignore::DeprecationWarning:asyncio.*
    ignore::pytest.PytestUnhandledThreadExceptionWarning
    ignore::UserWarning
