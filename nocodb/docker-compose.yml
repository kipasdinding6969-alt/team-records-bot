version: '3.8'

services:
  nocodb:
    image: nocodb/nocodb:latest
    container_name: nocodb
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NC_DB: "pg://nocodb-postgres:5432?u=nocodb&p=nocodb_secret_2026&d=nocodb"
      NC_AUTH_JWT_SECRET: "qianhub-nocodb-jwt-secret-2026-03-28"
      NC_PUBLIC_URL: "http://localhost:8080"
      NC_DISABLE_TELE: "true"
    volumes:
      - nocodb_data:/usr/app/data
    depends_on:
      nocodb-postgres:
        condition: service_healthy

  nocodb-postgres:
    image: postgres:16-alpine
    container_name: nocodb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: nocodb_secret_2026
    volumes:
      - nocodb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nocodb_data:
  nocodb_pgdata:
