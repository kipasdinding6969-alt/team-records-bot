name: CI — Team Records Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Full CI Pipeline
    runs-on: self-hosted
    env:
      TG_API_ID: "0"
      TG_API_HASH: "test"
      TG_PHONE: "+0000000000"
      SHEETS_ID: "test"
      DB_PATH: "/tmp/ci_test.db"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        run: |
          python3 --version
          python3 -m venv /tmp/ci-venv
          /tmp/ci-venv/bin/pip install -q -r requirements.txt
          /tmp/ci-venv/bin/pip install -q pytest pytest-asyncio pytest-mock flake8

      - name: Lint (flake8)
        run: |
          echo "=== FLAKE8 LINT ==="
          /tmp/ci-venv/bin/flake8 --max-line-length=120 --exclude=.venv,__pycache__,.git --count --statistics \
            *.py engines/ handlers/ utils/ || echo "Lint warnings (non-blocking)"

      - name: Security Scan
        run: |
          echo "=== SECURITY: Hardcoded secrets ==="
          ! grep -rn "sk-ant\|api_hash.*=.*['\"][0-9a-f]\{32\}" \
            --include="*.py" --exclude-dir=.venv --exclude-dir=tests --exclude-dir=.git . \
            && echo "✅ No hardcoded secrets" || echo "⚠️ Review above"
          echo "=== SECURITY: SQL injection ==="
          UNSAFE=$(grep -rn 'f".*SELECT\|f".*INSERT\|f".*UPDATE\|f".*DELETE' \
            --include="*.py" --exclude-dir=.venv --exclude-dir=tests --exclude-dir=.git . \
            | grep -v "# safe" | grep -v "whitelist" | grep -v "validated" || true)
          if [ -n "$UNSAFE" ]; then
            echo "⚠️ Potential SQL injection:"
            echo "$UNSAFE"
          else
            echo "✅ No SQL injection found"
          fi

      - name: Import Chain Test
        run: |
          echo "=== IMPORT CHAIN ==="
          /tmp/ci-venv/bin/python -c "
          from config import config
          from database import Database
          from models import ClientRecord, FinancialRecord, PerformanceRecord
          from engines.csv_reader import parse_client_csv, parse_financial_csv
          from utils.validators import validate_phone_number
          print('✅ All imports successful')
          "

      - name: Database Init Test
        run: |
          echo "=== DATABASE INIT ==="
          /tmp/ci-venv/bin/python -c "
          import asyncio
          from database import Database
          async def test():
              db = Database('/tmp/ci_test.db')
              await db.initialize()
              import aiosqlite
              async with aiosqlite.connect('/tmp/ci_test.db') as conn:
                  cursor = await conn.execute(\"SELECT name FROM sqlite_master WHERE type='table'\")
                  tables = [r[0] for r in await cursor.fetchall()]
                  print(f'✅ {len(tables)} tables: {tables}')
                  assert len(tables) >= 7, f'Expected 7+ tables, got {len(tables)}'
          asyncio.run(test())
          "

      - name: Run Tests
        run: |
          echo "=== PYTEST ==="
          /tmp/ci-venv/bin/python -m pytest tests/ -v --tb=short -x

      - name: Docker Build Test
        run: |
          if [ -f Dockerfile ]; then
            echo "=== DOCKER BUILD ==="
            docker build -t team-records-bot-test . && echo "✅ Docker build OK" || echo "⚠️ Docker build failed"
          else
            echo "No Dockerfile — skipping"
          fi

      - name: Cleanup
        if: always()
        run: rm -f /tmp/ci_test.db /tmp/ci-venv -rf
